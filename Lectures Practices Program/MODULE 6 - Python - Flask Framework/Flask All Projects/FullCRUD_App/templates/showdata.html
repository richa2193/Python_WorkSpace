<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: aliceblue;">
    <!-- <h1 style="text-align: center;color: brown;">Welcome to DBApp</h1> -->
    <!-- <hr> -->

    <!-- {{stdata}} -->
    <div class="container mt-5">

        <h1 class="text-center text-danger mb-4">
            Welcome to DBApp
        </h1>

        <table class="table table-bordered table-striped table-hover text-center">

            <thead class="table-dark">
                <tr>                
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>City</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                {% for i in stdata %}

                <tr>
                    <td>{{i.id}}</td>
                    <td>{{i.name}}</td>
                    <td>{{i.email}}</td>
                    <td>{{i.city}}</td>
                    <td>
                        <a href="/updatedata/{{i.id}}" class="btn btn-warning btn-sm">Update</a>

                        <a href="/deletedata/{{i.id}}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>

</html>
