<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Flask Project</a>

        <div>
            <a href="/" class="btn btn-light btn-sm">Home</a>
            <a href="/about" class="btn btn-light btn-sm">About</a>
            <!-- <a href="/contact" class="btn btn-light btn-sm">Contact</a> -->
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2>Contact Us</h2>

    <form>

        <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control">
        </div>

        <div class="mb-3">
            <label>Message</label>
            <textarea class="form-control" rows="4"></textarea>
        </div>

        <button class="btn btn-primary">
            Send Message
        </button>

    </form>

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2026 Flask Demo Project
</footer>

</body>
</html>
